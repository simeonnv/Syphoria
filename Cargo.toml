[workspace]
resolver = "3"
members = ["crates/syphoria", "crates/syphoria-api", "crates/syphoria-extension"]
default-members = ["crates/syphoria", "crates/syphoria-api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "query", "tokio", "http1", "http2"] }
backon = { version = "1.6.0", default-features = false, features = ["tokio-sleep"] }
bytesize = "2.7.0"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
console_log = "1.1.0"
dioxus = { version = "0.7.10", default-features = false, features = ["web", "html", "macro", "signals", "hooks", "launch"] }
email_address = "0.2.9"
enum_dispatch = "0.3.13"
env_logger = "0.11.11"
exn = "0.4.0-rc.1"
fqdn = { version = "0.5.2", features = ["serde", "domain-label-length-limited-to-63", "domain-name-length-limited-to-255", "domain-name-without-special-chars"] }
futures = "0.3.34"
hyper-util = { version = "0.1.21", features = ["server-auto", "service", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
jmap-client = "0.4.3"
js-sys = "0.3"
log = "0.4.34"
mime_guess = "2.0.5"
nucleo-matcher = "0.3.1"
psl = "2.1.241"
rand = "0.10.3"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false }
ratatui-textarea = { version = "0.9.2", default-features = false, features = ["termwiz"] }
reqwest = { version = "0.13.5", default-features = false }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "chrono"] }
russh = "0.55.0"
russh-sftp = "3.0.1"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.151"
serde_with = "3.24.0"
sha2 = "0.11.0"
syphoria-api = { path = "crates/syphoria-api" }
termwiz = "0.23"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
toml = { version = "1.1.6", features = ["serde"] }
unicode-width = "0.2"
url = { version = "2.5.8", features = ["serde"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-extensions-sys = "0.4.2"
web-sys = { version = "0.3", features = ["Clipboard", "Navigator", "Window", "console"] }
zeroize = { version = "1.9.0", features = ["derive", "zeroize_derive"] }
