[package]
name = "syphoria"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
email_address = "0.2.9"
enum_dispatch = "0.3.13"
exn = "0.4.0-rc.1"
fqdn = { version = "0.5.2", features = ["serde", "domain-label-length-limited-to-63", "domain-name-length-limited-to-255", "domain-name-without-special-chars"] }
futures = "0.3.34"
jmap-client = "0.4.3"
rand = "0.10.3"
ratatui = "0.30.2"
ratatui-textarea = { version = "0.9.2", default-features = false, features = ["termwiz"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
russh = "0.55.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.24.0"
termwiz = "0.23"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
toml = { version = "1.1.6", features = ["serde"] }
unicode-width = "0.2"
url = { version = "2.5.8", features = ["serde"] }
zeroize = { version = "1.9.0", features = ["derive", "zeroize_derive"] }
